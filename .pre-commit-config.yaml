repos:
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.11.2
    hooks:
      - id: markdown-link-check
        name: Check markdown links
        description: Check for broken links in markdown files
        entry: markdown-link-check
        language: node
        files: \.md$
        # docs/ pages use MkDocs-relative links that only resolve in the built
        # site; `make docs-build` (mkdocs --strict) validates those instead.
        exclude: ^(docs/|site/)
        args: [--config, .markdown-link-check.json]