name: Check Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Two passes, because the two kinds of markdown in this repository resolve
    # their relative links differently.
    #
    # 1. Repository markdown (READMEs, checklist, glossary) is read on GitHub, so
    #    relative and root-relative file links must resolve on disk.
    # 2. Pages under docs/ are read on the built site, so their relative links
    #    resolve to MkDocs URLs ("episodes/<slug>/") that do not exist as files.
    #    Those are validated by `mkdocs build --strict` in the deploy-docs
    #    workflow instead, so here only the web links are checked.
    #
    # Shared exclusions live in .lycheeignore.

    - name: Check links in repository markdown
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --no-progress
          --root-dir "$GITHUB_WORKSPACE"
          --exclude-path docs
          --exclude-path site
          --max-retries 3
          --retry-wait-time 5
          --timeout 45
          '**/*.md'
        fail: true

    - name: Check web links in docs/
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --no-progress
          --exclude '^file://'
          --max-retries 3
          --retry-wait-time 5
          --timeout 45
          'docs/**/*.md'
        fail: true
