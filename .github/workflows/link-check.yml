name: Check Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install lychee
      run: |
        wget https://github.com/lycheeverse/lychee/releases/download/v0.15.0/lychee-v0.15.0-x86_64-unknown-linux-gnu.tar.gz
        tar -xzf lychee-v0.15.0-x86_64-unknown-linux-gnu.tar.gz
        sudo mv lychee /usr/local/bin/

    - name: Check links in Markdown files
      # Exclusions live in .lycheeignore. YouTube rate-limits CI runners, and the
      # site's own URLs are skipped because a fresh page is published by the
      # deploy-docs workflow running concurrently with this one.
      run: |
        lychee --verbose --no-progress \
          --exclude "https://www.youtube.com/**" \
          --exclude "https://ubern-mia.github.io/bender/**" \
          --exclude-mail \
          --max-retries 2 \
          --accept 200,206,429 \
          '**/*.md' '!site/**' '!.venv/**' 